spring:
  application:
    name: telo

  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. Hibernate는 엔티티와 실제 테이블이 맞는지 검증만 한다.
      # update/create를 쓰면 금융 거래 테이블이 배포 때마다 예고 없이 바뀔 수 있다.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-version이 0이라 기존 테이블이 있는 DB에 붙여도 보호 효과가 없다.
    # 모든 마이그레이션이 처음부터 실행된다. 운영 DB에 나중에 Flyway를 도입할 일이
    # 생기면 그 시점의 실제 스키마 버전으로 baseline-version을 올려야 한다.
    baseline-on-migrate: true
    baseline-version: 0
    # 이미 적용된 것보다 낮은 버전의 마이그레이션이 나중에 들어오면 기동을 거부한다.
    # 기본값이지만 의도를 분명히 하려고 명시한다. 병합 전 재타임스탬프가 원칙이고,
    # scripts/check-migration-order.sh가 CI에서 이를 강제한다.
    out-of-order: false

  batch:
    jdbc:
      # BATCH_* 메타 테이블도 Flyway로 관리한다. 근거는
      # _workspace/sprint0_backend_summary.md 15장 참고.
      initialize-schema: never
