spring:
  application:
    name: telo
  datasource:
    url: jdbc:h2:mem:telo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  health:
    # Cloud SQL / Upstash가 아직 프로비저닝되지 않은 단계라 Redis 헬스 체크를 끈다.
    # Upstash 연결이 붙는 시점에 이 설정을 제거한다.
    redis:
      enabled: false
