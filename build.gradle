plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.petgyebu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Spring Boot 4.0에서 spring-boot-starter-aop이 spring-boot-starter-aspectj로 이름 변경됨
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	//gcp
	implementation 'com.google.cloud.sql:postgres-socket-factory:1.28.1'
	implementation 'com.google.firebase:firebase-admin:9.10.0'

	//codef
	implementation 'io.codef.api:easycodef-java:1.0.6'

	//resilience4j (Spring Boot 4 전용 애드온)
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

	//shedlock (분산락, Redis 백엔드)
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.9.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:7.9.0'

	//querydsl (원본이 아니라 OpenFeign 포크)
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jakarta'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	//flyway (버전은 Spring Boot 4.0 BOM이 관리한다 — 현재 11.14.1)
	// Spring Boot 4.0은 자동설정을 모듈로 쪼갰다. spring-boot-flyway가 없으면
	// FlywayAutoConfiguration이 클래스패스에 없어 Flyway가 조용히 아무것도 하지 않는다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// testcontainers — 운영 프로필(PostgreSQL + Flyway + ddl-auto validate)을 실제로
	// 검증한다. local 프로필(H2)만 테스트하면 마이그레이션 누락을 CI가 못 잡는다.
	// Testcontainers 2.x에서 모듈 좌표가 'testcontainers-' 접두사로 바뀌었다.
	// 구 좌표(org.testcontainers:postgresql, :junit-jupiter)는 1.21.x에서 멈춰 있어
	// Spring Boot 4.0 BOM이 관리하는 2.0.5와 맞지 않는다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()

	// 테스트는 일부러 UTC로 돌린다. 운영 컨테이너는 TZ=Asia/Seoul이지만, 여기서도 KST로
	// 맞춰버리면 JVM 기본 존에 의존하는 코드(LocalDate.now(), zone 없는 @Scheduled)가
	// 개발자 노트북에서도 CI에서도 통과해 버린다. 존을 명시하지 않은 코드는 여기서 깨져야 한다.
	// 기준 존이 필요한 곳은 AppZone.KST를 쓴다.
	systemProperty 'user.timezone', 'UTC'
}
